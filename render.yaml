services:
  - type: web
    name: couple-miss-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      # 注意：PORT 不要写死，由 Render 自动注入（后端代码已用 process.env.PORT）
      - key: DATA_DIR
        value: /data
    # 持久化说明：
    # 免费实例的文件系统是临时的，重新部署/重启会清空 backend/data 里的数据。
    # 若要长久保存（思念次数、日记、卡片进度），请在 Render 面板为服务挂载一块
    # Render Disk，挂载路径填 /data（与上面 DATA_DIR 一致）即可永久保存。
    # 不挂盘也能正常运行，只是数据会在重建时重置。
